name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make icon
        run: pip install pillow && python make_icon.py
      - name: Install
        run: npm install
      - name: Bundle three.js
        run: cp node_modules/three/build/three.min.js www/three.min.js
      - name: Add Android
        run: npx cap add android
      - name: Generate icons
        run: npx capacitor-assets generate --android
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
